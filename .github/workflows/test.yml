name: Medical Software Verification CI

# 触发条件：当向 main 或 master 分支提交 (push) 或发起 Pull Request 时触发
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  verification-suite:
    runs-on: ubuntu-latest  # 使用 Linux 虚拟机环境

    steps:
      # 1. 拉取代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 配置 Python 环境
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. 安装依赖包
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-sqlalchemy pydicom pytest requests numpy allure-pytest

      # 4. 自动生成 DICOM 正常与异常测试数据集
      - name: Generate Synthetic DICOM Test Suite
        run: |
          python test_data/generate_dicom.py

      # 5. 在后台启动 Flask 医疗影像系统后端，并等待 3 秒确保服务就绪
      - name: Start Medical System Backend
        run: |
          python main.py &
          sleep 3

      # 6. 执行 Pytest 自动化测试集并生成 Allure 原始测试结果
      - name: Run Pytest API Verification Suite
        run: |
          pytest tests/api/test_dicom_api.py -v --alluredir=./allure-results

      # 7. 归档保存 Allure 测试结果文件（作为 CI 构建产物 Artifact）
      - name: Upload Allure Results Artifact
        uses: actions/upload-artifact@v4
        if: always() # 即使测试失败也要上传报告产物，用于排查 Bug
        with:
          name: allure-results
          path: allure-results/